name: Nálada trhu na Telegram

# Když týdenní report nálady (naplánovaná úloha) zapíše nové shrnutí, pošle ho na Telegram.
on:
  push:
    branches: [main]
    paths: [research/mood_digest.md]

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pyyaml pandas
      - name: Odeslat report nálady
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 research/send_digest.py mood
