name: Výzkum – atlas strategií

# 15 rodin strategií × 7 timeframů s poplatky MEXC (research/experiments/strategy_atlas.py).
# Každý timeframe běží zvlášť a paralelně, souhrnný job složí report a uloží ho do větve.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["research/experiments/strategy_atlas.py", ".github/workflows/strategy-atlas.yml"]

permissions:
  contents: write

jobs:
  tf:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        tf: ["15m", "1h", "2h", "4h", "6h", "12h", "1d"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -q -r scanner/requirements.txt numba
      - name: Atlas ${{ matrix.tf }}
        run: python3 research/experiments/strategy_atlas.py run ${{ matrix.tf }} /tmp/cache
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-${{ matrix.tf }}
          path: |
            reports/atlas/${{ matrix.tf }}.csv.gz
            reports/atlas/${{ matrix.tf }}.meta

  report:
    needs: tf
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pandas numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: atlas-*
          path: reports/atlas
          merge-multiple: true
      - name: Souhrnný report
        run: |
          ls -la reports/atlas
          python3 research/experiments/strategy_atlas.py report reports/atlas
          cat reports/strategy_atlas.md >> "$GITHUB_STEP_SUMMARY"
      - name: Uložit do větve
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/strategy_atlas.md reports/atlas/*.csv.gz reports/atlas/*.meta
          git commit -m "atlas: výsledky atlasu strategií (poplatky MEXC)" || exit 0
          git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}"
