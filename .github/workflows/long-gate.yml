name: Výzkum – brána směru podle stavu trhu

# Předem stanovený test (research/experiments/long_gate.py): blokovat longy laboratoře v medvědím režimu BTC nebo
# křehkém trhu (shorty zrcadlově)? Výsledek: reports/long_gate.md + research/long_gate.json (čte scanner/lab_paper.py).
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["research/experiments/long_gate.py", ".github/workflows/long-gate.yml"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -q -r scanner/requirements.txt numba
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/cache
          key: lab-data-${{ github.run_id }}
          restore-keys: lab-data-
      - name: Brána směru
        run: |
          python3 research/experiments/long_gate.py /tmp/cache
          cat reports/long_gate.md >> "$GITHUB_STEP_SUMMARY"
      - name: Uložit do větve
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in reports/long_gate.md research/long_gate.json; do
            if [ -e "$f" ]; then git add -f "$f"; fi
          done
          git commit -q -m "long-gate: výsledky testu brány směru" || exit 0
          git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}"
