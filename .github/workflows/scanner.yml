name: Rychlý skener (zkušební)

# Naplánované spouštění GitHub u málo aktivních repozitářů často vynechává, proto jeden běh
# skenuje KAŽDOU MINUTU ~5,5 h a na konci se sám znovu spustí (workflow_dispatch).
# cron je jen záloha, kdyby se řetěz přerušil. Veřejný repozitář = minuty zdarma.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Jen jeden průchod, nic neposílat"
        type: boolean
        default: false

permissions:
  contents: write   # commit deníku signálů a datových listů
  actions: write    # znovuspuštění sebe sama

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -q -r scanner/requirements.txt
      # cache svíček + state.json mezi běhy (obnoví se poslední uložená verze)
      - uses: actions/cache/restore@v4
        with:
          path: |
            scanner/cache
            scanner/state.json
            scanner/paper_trades.json
          key: scanner-state-${{ github.run_id }}
          restore-keys: scanner-state-
      - name: Skenování každou minutu (~5,5 h)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OKX_DEMO_API_KEY: ${{ secrets.OKX_DEMO_API_KEY }}
          OKX_DEMO_API_SECRET: ${{ secrets.OKX_DEMO_API_SECRET }}
          OKX_DEMO_PASSPHRASE: ${{ secrets.OKX_DEMO_PASSPHRASE }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          git config user.name "trading-team scanner"
          git config user.email "scanner@users.noreply.github.com"
          if [ -n "$DRY_RUN" ]; then python3 scanner/scan.py --once --dry-run; exit 0; fi
          end=$((SECONDS + 330 * 60))
          while [ $SECONDS -lt $end ]; do
            start=$SECONDS
            python3 scanner/scan.py --once || echo "průchod selhal, pokračuji"
            # nové signály, datové listy a výsledky obchodů hned do repozitáře (čte je AI desk)
            if [ -n "$(git status --porcelain scanner/signals.jsonl research/factsheets research/outcomes.jsonl research/demo_trades.jsonl research/pyramid_outcomes.jsonl research/mood_log.jsonl 2>/dev/null)" ]; then
              git add scanner/signals.jsonl
              [ -d research/factsheets ] && git add research/factsheets
              [ -f research/outcomes.jsonl ] && git add research/outcomes.jsonl
              [ -f research/demo_trades.jsonl ] && git add research/demo_trades.jsonl
              [ -f research/pyramid_outcomes.jsonl ] && git add research/pyramid_outcomes.jsonl
              [ -f research/mood_log.jsonl ] && git add research/mood_log.jsonl
              git commit -q -m "scanner: nové signály / výsledky"
              for i in 1 2 3; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin HEAD:"${GITHUB_REF_NAME}" && break; sleep 5; done
            fi
            sleep $(( 60 - (SECONDS - start) > 1 ? 60 - (SECONDS - start) : 1 ))
          done
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            scanner/cache
            scanner/state.json
            scanner/paper_trades.json
          key: scanner-state-${{ github.run_id }}
      - name: Znovu spustit (navazující běh)
        if: ${{ always() && !inputs.dry_run && github.ref_name == 'main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run scanner.yml --ref main
