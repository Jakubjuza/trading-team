name: Downtown – divoké strategie (papír)

# Papírové účty divokých strategií s pákou (research/downtown.py). ODDĚLENÉ od desku – na skener, registr,
# riziko ani peníze nesahá. Každé 4 hodiny přepočítá zpětný test a živý papír a uloží research/downtown.json
# a reports/downtown.md; Agentown (čtvrť Downtown) si je denně načte do databáze stránky.
on:
  schedule:
    - cron: "11 */4 * * *"
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["research/downtown.py", ".github/workflows/downtown.yml"]

permissions:
  contents: write

concurrency:
  group: downtown-${{ github.ref }}
  cancel-in-progress: false

jobs:
  downtown:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -q -r scanner/requirements.txt
      - uses: actions/cache@v4
        with:
          path: /tmp/dt_cache
          key: downtown-data-${{ github.run_id }}
          restore-keys: downtown-data-
      - name: Testy Downtownu
        run: python3 -m pytest tests/test_downtown.py -q
      - name: Downtown – zpětný test + živý papír
        run: python3 research/downtown.py /tmp/dt_cache
      - run: cat reports/downtown.md >> "$GITHUB_STEP_SUMMARY"
      - name: Uložit výsledky
        run: |
          git config user.name "trading-team downtown"
          git config user.email "downtown@users.noreply.github.com"
          git add -f research/downtown.json reports/downtown.md
          git commit -q -m "downtown: papírové účty divokých strategií" || exit 0
          for i in 1 2 3; do
            git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done
