name: Demo OKX – kontrola

# Ověří demo klíče (GitHub Secrets) a volitelně jeden malý testovací obchod na DEMO účtu (virtuální peníze).
on:
  workflow_dispatch:
    inputs:
      test_order:
        description: "Otevřít a hned zavřít 2 kontrakty BTC na demo účtu"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -q -r scanner/requirements.txt
      - name: Kontrola demo účtu
        env:
          OKX_DEMO_API_KEY: ${{ secrets.OKX_DEMO_API_KEY }}
          OKX_DEMO_API_SECRET: ${{ secrets.OKX_DEMO_API_SECRET }}
          OKX_DEMO_PASSPHRASE: ${{ secrets.OKX_DEMO_PASSPHRASE }}
        run: python3 scanner/demo.py ${{ inputs.test_order && '--test-order' || '' }}
