name: Mozek města – studie

# Studie „Mozek města“ (research/experiments/brain_study.py): kupole podle rizika × ziskovosti a přesun vah podle
# fáze trhu. Jen výzkum na papíře – na skener, riziko, demo ani peníze nesahá. Spouští se ručně.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brain-study
  cancel-in-progress: false

jobs:
  brain:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -q -r scanner/requirements.txt numba
      # jen obnovit (neukládat): svíčky laboratoře a denní svíčky skeneru
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/cache
          key: lab-data-${{ github.run_id }}
          restore-keys: lab-data-
      - uses: actions/cache/restore@v4
        with:
          path: |
            scanner/cache
          key: scanner-state-${{ github.run_id }}
          restore-keys: scanner-state-
      - name: Studie mozku
        run: python3 research/experiments/brain_study.py /tmp/cache scanner/cache
      - name: Uložit
        run: |
          git config user.name "trading-team brain"
          git config user.email "brain@users.noreply.github.com"
          git add -f research/brain_study.json reports/brain_study.md
          git commit -q -m "brain-study: kupole a mozek města (studie)" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin HEAD:"${GITHUB_REF_NAME}" && break; sleep 5; done
