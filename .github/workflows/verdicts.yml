name: Verdikty na Telegram

# Když AI desk zapíše nový verdikt do research/verdicts.jsonl, pošle ho na Telegram.
on:
  push:
    branches: [main]
    paths: [research/verdicts.jsonl]

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pyyaml pandas
      - name: Odeslat nové verdikty
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 research/send_verdicts.py "${{ github.event.before }}" "${{ github.sha }}"
