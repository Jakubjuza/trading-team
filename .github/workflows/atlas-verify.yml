name: Výzkum – ověření kandidáta z atlasu

# Nezávislý přepočet kandidáta (research/experiments/atlas_verify.py); výstup se uloží do reports/atlas_verify.txt.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["research/experiments/atlas_verify.py", ".github/workflows/atlas-verify.yml"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -q -r scanner/requirements.txt
      - name: Ověření
        run: python3 research/experiments/atlas_verify.py /tmp/cache | tee reports/atlas_verify.txt
      - name: Uložit do větve
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/atlas_verify.txt
          git commit -m "atlas: nezávislé ověření kandidáta" || exit 0
          git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}"
