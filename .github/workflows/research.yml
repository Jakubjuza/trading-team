name: Výzkum naživo

# Analýzy, které potřebují data blokovaná v sandboxu (Hyperliquid…). Spouští se ručně, nebo pushem
# změny výzkumného skriptu na větev claude/**; výsledek je v logu běhu.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Který výzkum: carry, mtf15 nebo capitulation"
        type: choice
        options: [carry, mtf15, capitulation]
        default: carry
  push:
    branches: ["claude/**"]
    paths: ["research/carry.py", "research/experiments/mtf15.py", "research/experiments/capitulation.py"]

permissions:
  contents: read

jobs:
  carry:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'carry' || github.event_name == 'push' && contains(join(github.event.commits.*.modified, ','), 'carry')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -q -r scanner/requirements.txt
      - name: Carry z fundingu – backtest 2 roky + aktuální stav
        run: |
          python3 research/carry.py --report --days 730 --out /tmp/carry.md
          python3 research/carry.py --now

  mtf15:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'mtf15' || github.event_name == 'push' && contains(join(github.event.commits.*.modified, ','), 'mtf15')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -q -r scanner/requirements.txt
      - name: Vstup z nižších TF – H4 (sweep 1H) a M15 vs. dnešní C (15M data z OKX)
        run: python3 research/experiments/mtf15.py /tmp/cache

  capitulation:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'capitulation' || github.event_name == 'push' && contains(join(github.event.commits.*.added, ','), 'capitulation')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -q -r scanner/requirements.txt
      - name: Chycení kapitulace – long na dně po panice (Fear & Greed z alternative.me)
        run: python3 research/experiments/capitulation.py /tmp/cache
