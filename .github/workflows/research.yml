name: Výzkum naživo

# Analýzy, které potřebují data blokovaná v sandboxu (Hyperliquid…). Spouští se ručně, nebo pushem
# změny výzkumného skriptu na větev claude/**; výsledek je v logu běhu.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["research/carry.py", ".github/workflows/research.yml"]

permissions:
  contents: read

jobs:
  carry:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -q -r scanner/requirements.txt
      - name: Carry z fundingu – backtest 2 roky + aktuální stav
        run: |
          python3 research/carry.py --report --days 730 --out /tmp/carry.md
          python3 research/carry.py --now
