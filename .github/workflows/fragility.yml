name: Výzkum – křehkost trhu a pozdní vstup

# Předem stanovený test (research/experiments/fragility_test.py): reaguje trh v „křehkém“ stavu víc na špatné zprávy
# a pomůže to denním strategiím? A ztrácejí vstupy po velkém pohybu dne? Výsledek: reports/fragility.md.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["research/fragility.py", "research/experiments/fragility_test.py", ".github/workflows/fragility.yml"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -q -r scanner/requirements.txt
      - name: Test
        run: |
          python3 research/experiments/fragility_test.py /tmp/cache
          cat reports/fragility.md >> "$GITHUB_STEP_SUMMARY"
      - name: Uložit do větve
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -e reports/fragility.md ]; then git add -f reports/fragility.md; fi
          git commit -q -m "fragility: výsledky testu křehkosti a pozdního vstupu" || exit 0
          git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}"
