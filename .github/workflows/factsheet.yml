name: Datový list

# Ručně: vygeneruje datový list pro symbol (burza, Hyperliquid, Deribit, makro, historie) a commitne ho.
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "ccxt symbol, např. BTC/USDT"
        required: true
        default: BTC/USDT

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -q -r scanner/requirements.txt
      - name: Sestavit datový list
        run: |
          COIN=$(echo "${{ inputs.symbol }}" | cut -d/ -f1)
          OUT="research/factsheets/manual_${COIN}_$(date -u +%Y%m%d_%H%M).json"
          python3 research/factsheet.py "${{ inputs.symbol }}" --out "$OUT"
          python3 -c "import json,sys; d=json.load(open('$OUT')); [print(k, '→', 'CHYBA: '+v['error'] if isinstance(v,dict) and 'error' in v else 'OK') for k,v in d.items() if isinstance(v,dict) and k!='signal']"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
      - name: Commit
        run: |
          git config user.name "trading-team factsheet"
          git config user.email "factsheet@users.noreply.github.com"
          git add "$OUT"
          git commit -m "factsheet: ${{ inputs.symbol }}"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}"
