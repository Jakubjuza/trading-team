# Konfigurace rychlého skeneru (bez AI). Token a chat ID sem NEPATŘÍ –
# čtou se z proměnných prostředí TELEGRAM_BOT_TOKEN a TELEGRAM_CHAT_ID.

tickers:
  - {symbol: BTC/USDT, source: crypto}
  - {symbol: ETH/USDT, source: crypto}
  - {symbol: SOL/USDT, source: crypto}
  - {symbol: XRP/USDT, source: crypto}
  # přidáno 10/2026 – stejná pravidla otestovaná na coinech mimo optimalizaci (viz reports/scanner_improvements.md)
  - {symbol: ADA/USDT, source: crypto}
  - {symbol: LINK/USDT, source: crypto}
  - {symbol: AVAX/USDT, source: crypto}
  - {symbol: DOGE/USDT, source: crypto}
  # akcie přes yfinance, např.:
  # - {symbol: AAPL, source: stock, timeframe: 1h}

exchange: kraken          # ccxt burza pro krypto (kraken, bybit, okx, coinbase…)
timeframe: 1h             # 1m, 5m, 15m, 30m, 1h, 4h, 1d (lze přepsat u tickeru)
direction: both           # long | short | both
poll_seconds: 60          # jak často kontrolovat
history_bars: 600         # kolik svíček držet v cache (EMA 200 potřebuje rozjezd)

account_size: 10000       # USD
risk_pct: 0.5             # % účtu na obchod (sníženo z 1 % na dobu ověřování; backtest: propad −17 % místo −31 %)
min_rr: 1.5               # minimální R:R na T1 (před náklady; po nákladech je ve zprávě)
max_setups_per_day: 3     # celkem za všechny tickery (den podle timezone)
max_open_per_direction: 1 # max. 1 otevřená (papírová) pozice long a 1 short naráz – krypto se hýbe spolu
                          # backtest: max. propad 96 R → 36 R
timezone: Europe/Prague
heartbeat_hours: 4        # zpráva „skener běží“ i bez setupů (0 = vypnuto); první hned po spuštění
cash_only: true           # pozice nesmí přesáhnout velikost účtu

rules: &brh_rules          # parametry breakout → retest → hold (viz scanner/rules.py)
  range_lookback: 20
  min_range_pct: 0.5
  max_range_pct: 8.0
  retest_window: 6
  tolerance_pct: 0.3
  stop_buffer_atr: 0.1
  min_stop_atr: 0.5
  min_stop_pct: 1.5            # stop aspoň 1,5 % od vstupu – jinak ho sežerou poplatky
  target_mode: measured_move   # measured_move | r_multiple
  target_multiples: [1.0, 2.0]
  trend_ema: 200               # long jen nad EMA 200, short jen pod (0 = vypnuto)
  breakout_volume_mult: 1.5    # objem breakout svíčky >= 1,5× průměr range (0 = vypnuto)
  skip_weekends: true          # krypto o víkendu: slabá likvidita, víc falešných průrazů

exit: &brh_exit            # správa obchodu (pro vyhodnocení a plán ve zprávě)
  split: 0.5              # podíl pozice na T1, zbytek na T2
  trail_atr: 0            # >0 = po T1 trailing stop k×ATR místo pevného T2
  max_hold_bars: 48       # časový výstup

# Strategie = setup + časový rámec. Každá ověřená na historii (reports/setup_library.md):
# 2 roky 1h / 9 let 1d, po nákladech, out-of-sample, coiny mimo optimalizaci, proti náhodným vstupům.
# Na 1h a 4h NEOBSTÁLY: pullback, sweep_reclaim, squeeze_breakout, donchian_breakout, range_fade (enabled: false).
strategies:
  - name: brh_1h                 # VYPNUTO 25. 10. 2026: OOS +0,01 ± 0,21 R (bez výhody), DD ~99 R přes 8 mincí
    enabled: false               # (reports/setup_library.md); zapnout = smazat tento řádek
    setup: breakout_retest_hold
    timeframe: 1h
    params: *brh_rules
    exit: *brh_exit
    min_rr: 1.5
    max_open_per_direction: 1
  - name: donchian_1d            # průraz 20denního max/min ve směru EMA 200; 9 coinů 2015–2026: +0,37 R/obchod
    setup: donchian_breakout
    timeframe: 1d
    params: {channel: 20, stop_atr: 2.0, trend_ema: 200, min_stop_pct: 1.5, target_multiples: [2.0, 4.0],
             panic_vol_rank: 0.8, panic_window: 365}   # bez vstupu v panice (reports/adaptive.md)
    exit: {split: 0.5, trail_atr: 3.0, max_hold_bars: 20}
    min_rr: 1.0
    max_open_per_direction: 2
  - name: pullback_1d            # trend + návrat k EMA20 + obratová svíčka; 9 coinů 2015–2026: +0,27 R/obchod
    setup: pullback
    timeframe: 1d
    params: {lookback: 3, trend_ema: 200, min_stop_pct: 1.5, target_multiples: [2.0, 4.0],
             panic_vol_rank: 0.8, panic_window: 365}
    exit: {split: 0.5, trail_atr: 3.0, max_hold_bars: 20}
    min_rr: 1.0
    max_open_per_direction: 2
  - {name: sweep_reclaim_4h, setup: sweep_reclaim, timeframe: 4h, enabled: false}
  - {name: squeeze_breakout_1d, setup: squeeze_breakout, timeframe: 1d, enabled: false}
  - {name: range_fade_1h, setup: range_fade, timeframe: 1h, enabled: false}

approach_alerts:          # „⏳ setup se blíží“ – jen informace, ne signál ke vstupu
  enabled: true
  atr_distance: 0.5       # cena do 0,5 ATR od hladiny Donchian kanálu ve směru trendu
  max_per_day: 4

events:                   # kalendář (Fed, CPI, NFP …) a zprávy – research/events.py, bez AI
  enabled: true
  digest_hour: 8          # ranní „📅 Kalendář dnes a zítra“ (čas Prahy), jen když něco je
  pre_alert_minutes: 60   # „⚠️ Za 60 min: CPI …“ u událostí s vysokým dopadem
  signal_hours: 24        # v signálu zmínit událost do 24 h
  news_alerts: true       # „📰“ titulek k minci z watchlistu s klíčovými slovy (regulace, ETF, hack, listing)
  news_tags: [regulace, etf, bezpečnost, burzy]
  news_max_per_day: 4
  news_max_age_min: 120

outlook:                  # 📆 týdenní výhled – research/scenarios.py (rozpětí z historie při dnešní volatilitě)
  enabled: true
  weekday: 0              # 0 = pondělí
  hour: 8                 # čas Prahy
  horizon: 13 týdnů

probabilities: scanner/probabilities.json   # tabulka z scanner/calibrate.py

costs:                    # poplatek + skluz na JEDNU stranu, v % ceny
  fee_pct: 0.1            # zkontroluj u své burzy! (Kraken taker až 0,40 % → strategie je pak ztrátová)
  slippage_pct: 0.05

notify:
  telegram: true
  chart: true             # PNG přes .claude/skills/chart-report/render_chart.py
  chart_bars: 80

ai_explain:               # AI až PO nalezení setupu (volitelné, výchozí vypnuto)
  enabled: false
  # příkaz dostane cestu k JSON se setupem v {setup_json}; výstup se pošle na Telegram
  command: "claude -p 'Vysvětli setup v {setup_json} podle CLAUDE.md, max 5 řádků česky.'"

factsheet: true           # ke každému signálu datový list pro AI desk (research/factsheets/)

paper_trading: true       # zapisovat papírové obchody do scanner/paper_trades.json
live_trading: false       # ostré obchody – NIKDY nezapínat bez výslovného potvrzení
