<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Roj částic</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen stage. WebGL swarm fills the screen; wordmark top-left, headline bottom-left, shape switcher bottom-right (stacked on phones). Single dark look by choice: light from the particles themselves. */
:root{
  --bg:#04050d; --fg:#eef1ff; --muted:#8890b8; --line:rgba(160,170,255,.18);
  --teal:#3ee6c6; --blue:#4d7dff; --violet:#9a6bff;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-display);overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;background:radial-gradient(120% 90% at 70% 40%,#0d1240 0%,#070920 45%,var(--bg) 100%)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(env(safe-area-inset-top,0px) + 20px) calc(env(safe-area-inset-bottom,0px) + 22px)}
.ui > *{pointer-events:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.mark{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.02em}
.mark i{width:12px;height:12px;border-radius:50%;background:conic-gradient(var(--teal),var(--blue),var(--violet),var(--teal));box-shadow:0 0 14px var(--teal)}
.meta{font:500 11.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.hero{max-width:min(620px,100%);display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
h1{margin:0;font-weight:300;font-size:clamp(40px,7.2vw,92px);line-height:.95;letter-spacing:-.035em;text-wrap:balance}
h1 b{font-weight:700;background:linear-gradient(100deg,var(--teal),var(--blue) 55%,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{margin:0;max-width:46ch;font-size:16px;line-height:1.5;color:#c3c8ea}
.switch{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.count{font:500 12px var(--f-mono);letter-spacing:.1em;color:var(--muted);font-variant-numeric:tabular-nums}
.count b{color:var(--fg);font-weight:500}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{min-height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:rgba(10,12,34,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  color:#c3c8ea;font:500 14px var(--f-display);cursor:pointer;transition:border-color .2s,color .2s,background .2s}
.chip:hover{border-color:rgba(62,230,198,.6);color:var(--fg)}
.chip[aria-pressed="true"]{border-color:var(--teal);color:var(--fg);background:rgba(62,230,198,.12);box-shadow:0 0 18px -6px var(--teal)}
.chip:focus-visible,.play:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
.bar{width:100%;max-width:260px;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--violet))}
.play{background:none;border:0;color:var(--muted);font:500 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;padding:6px 0}
.play:hover{color:var(--fg)}
.fallback{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
@media (max-width:700px){
  .bottom{flex-direction:column;align-items:stretch;gap:18px}
  .switch{align-items:stretch}
  .chips{justify-content:flex-start}
  .count{text-align:left}
  .bar{max-width:none}
  .lead{font-size:14.5px}
  .meta span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="stage" aria-hidden="true"></div>
<div class="ui">
  <header class="top">
    <div class="mark"><i></i>roj</div>
    <div class="meta"><span id="nPts">24 000</span> částic<span> · WebGL · reaguje na pohyb</span></div>
  </header>
  <section class="bottom">
    <div class="hero">
      <span class="eyebrow">Živé rozhraní</span>
      <h1>Tvar, který se <b>přelévá</b></h1>
      <p class="lead">Každá tečka zná svoje místo ve čtyřech tvarech a putuje mezi nimi vlastní cestou. Pohni kurzorem nebo prstem a roj ti uhne z cesty.</p>
    </div>
    <div class="switch">
      <div class="count"><b id="idx">01</b> / 04 · <span id="shapeName">Mozek</span></div>
      <div class="chips" role="group" aria-label="Tvar roje">
        <button class="chip" type="button" data-i="0" aria-pressed="true">Mozek</button>
        <button class="chip" type="button" data-i="1" aria-pressed="false">Prstenec</button>
        <button class="chip" type="button" data-i="2" aria-pressed="false">Koule</button>
        <button class="chip" type="button" data-i="3" aria-pressed="false">Kostka</button>
      </div>
      <div class="bar" aria-hidden="true"><i id="prog"></i></div>
      <button class="play" type="button" id="play" aria-pressed="true">❚❚ Pozastavit střídání</button>
    </div>
  </section>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const small = Math.min(innerWidth, innerHeight) < 700;
const N = small ? 14000 : 24000;
document.getElementById('nPts').textContent = N.toLocaleString('cs-CZ');
const stage = document.getElementById('stage');

let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias:false, alpha:true, powerPreference:'high-performance' }); }
catch (e) { stage.innerHTML = '<div class="fallback">Prohlížeč nespustil WebGL. Zkus jiný prohlížeč nebo zapni hardwarovou akceleraci.</div>'; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, .1, 100);
camera.position.set(0, 0, 6.2);

/* ---------- tvary: každá funkce vrátí N bodů ---------- */
let seed = 11;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
function onSphere(){ const z = rnd() * 2 - 1, a = rnd() * Math.PI * 2, r = Math.sqrt(1 - z * z); return [r * Math.cos(a), z, r * Math.sin(a)]; }

function brain(){
  const out = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    let x, y, z;
    const pick = rnd();
    if (pick < .84) {                       // dvě hemisféry se závity
      const side = rnd() < .5 ? -1 : 1;
      const [sx, sy, sz] = onSphere();
      const fold = 1 + .07 * Math.sin(sx * 11 + sy * 7) * Math.sin(sy * 13 - sz * 5) + .04 * Math.sin(sz * 17 + sx * 9);
      x = side * (.06 + Math.abs(sx) * .78) * fold; y = sy * .74 * fold; z = sz * 1.05 * fold;
      if (y < -.35) y = -.35 + (y + .35) * .5;   // plošší spodek
      const k = .97 + rnd() * .03; x *= k; y *= k; z *= k;
    } else if (pick < .95) {                // mozeček vzadu dole
      const [sx, sy, sz] = onSphere();
      const fold = 1 + .05 * Math.sin(sy * 30);
      x = sx * .5 * fold; y = -.42 + sy * .24 * fold; z = -.62 + sz * .3 * fold;
    } else {                                // kmen
      const a = rnd() * Math.PI * 2, h = rnd();
      x = Math.cos(a) * .11; y = -.45 - h * .65; z = -.25 + Math.sin(a) * .11 - h * .12;
    }
    out.set([x * 1.55, y * 1.55 + .2, z * 1.55], i * 3);
  }
  return out;
}
function ring(){
  const out = new Float32Array(N * 3), R = 1.45, r = .5;
  for (let i = 0; i < N; i++) {
    const u = rnd() * Math.PI * 2, v = rnd() * Math.PI * 2;
    const rr = r * (1 + .18 * Math.sin(u * 6 + v * 2)) + gauss() * .02;
    const x = (R + rr * Math.cos(v)) * Math.cos(u), y = (R + rr * Math.cos(v)) * Math.sin(u), z = rr * Math.sin(v);
    // nakloněný ke kameře
    const c = Math.cos(1.05), s = Math.sin(1.05);
    out.set([x, y * c - z * s, y * s + z * c], i * 3);
  }
  return out;
}
function sphere(){
  const out = new Float32Array(N * 3), golden = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < N; i++) {
    const y = 1 - (i + .5) / N * 2, r = Math.sqrt(1 - y * y), a = i * golden;
    const shell = rnd() < .82 ? 1.55 : 1.55 * (.2 + rnd() * .75);   // povrch + trocha jádra
    out.set([Math.cos(a) * r * shell, y * shell, Math.sin(a) * r * shell], i * 3);
  }
  return out;
}
function cube(){
  const out = new Float32Array(N * 3), h = 1.05;
  const rx = Math.atan(1 / Math.SQRT2), ry = Math.PI / 4;   // izometrický pohled jako logo Agentownu
  const cx = Math.cos(rx), sx = Math.sin(rx), cy = Math.cos(ry), sy = Math.sin(ry);
  for (let i = 0; i < N; i++) {
    let p;
    if (rnd() < .3) {                       // hrany
      const e = Math.floor(rnd() * 12), t = rnd() * 2 - 1, a = [[1,1],[1,-1],[-1,1],[-1,-1]][e % 4];
      p = e < 4 ? [t, a[0], a[1]] : e < 8 ? [a[0], t, a[1]] : [a[0], a[1], t];
      p = p.map(v => v * h + gauss() * .012);
    } else {                                // plochy
      const f = Math.floor(rnd() * 6), u = rnd() * 2 - 1, v = rnd() * 2 - 1, sgn = f % 2 ? -1 : 1;
      p = f < 2 ? [sgn, u, v] : f < 4 ? [u, sgn, v] : [u, v, sgn];
      p = p.map(c => c * h);
    }
    let [x, y, z] = p;
    [x, z] = [x * cy + z * sy, -x * sy + z * cy];
    [y, z] = [y * cx - z * sx, y * sx + z * cx];
    out.set([x, y, z], i * 3);
  }
  return out;
}
const SHAPES = [['Mozek', brain()], ['Prstenec', ring()], ['Koule', sphere()], ['Kostka', cube()]];

/* ---------- částice: přechod mezi tvary počítá shader ---------- */
const geo = new THREE.BufferGeometry();
const aFrom = new Float32Array(SHAPES[0][1]), aTo = new Float32Array(SHAPES[0][1]), aRnd = new Float32Array(N);
for (let i = 0; i < N; i++) aRnd[i] = rnd();
geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(aTo), 3));
geo.setAttribute('aFrom', new THREE.BufferAttribute(aFrom, 3));
geo.setAttribute('aTo', new THREE.BufferAttribute(aTo, 3));
geo.setAttribute('aRnd', new THREE.BufferAttribute(aRnd, 1));
geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 4);

const uniforms = {
  uMorph:{ value:1 }, uTime:{ value:0 }, uPix:{ value:renderer.getPixelRatio() }, uSize:{ value:small ? 34 : 30 },
  uMouse:{ value:new THREE.Vector3(9, 9, 0) }, uMouseOn:{ value:0 }, uMotion:{ value:reduce ? .25 : 1 },
  cA:{ value:new THREE.Color('#3ee6c6') }, cB:{ value:new THREE.Color('#4d7dff') }, cC:{ value:new THREE.Color('#9a6bff') },
};
const mat = new THREE.ShaderMaterial({
  uniforms, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:/* glsl */`
    attribute vec3 aFrom; attribute vec3 aTo; attribute float aRnd;
    uniform float uMorph, uTime, uPix, uSize, uMouseOn, uMotion;
    uniform vec3 uMouse, cA, cB, cC;
    varying vec3 vCol; varying float vA;
    void main(){
      float t = clamp(uMorph * 1.45 - aRnd * .45, 0., 1.);
      t = t * t * (3. - 2. * t);
      vec3 p = mix(aFrom, aTo, t);
      float mid = sin(3.14159 * t);
      p += vec3(sin(aRnd * 41. + uTime * .9), cos(aRnd * 29. + uTime * .7), sin(aRnd * 17. - uTime * .5)) * .55 * mid;
      vec3 n = normalize(p + vec3(1e-4));
      float w = sin(uTime * 1.15 + p.y * 2.7 + aRnd * 6.283) * .55 + sin(uTime * .8 + p.x * 3.3 - p.z * 1.7) * .45;
      p += n * w * .05 * uMotion;
      vec3 d = p - uMouse;
      float dist = length(d);
      float f = smoothstep(1.05, 0., dist) * uMouseOn;
      p += normalize(d + vec3(1e-4)) * f * .55;
      vec4 mv = modelViewMatrix * vec4(p, 1.);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = uSize * uPix * (.45 + aRnd * .75) / -mv.z;
      float h = clamp(p.y * .32 + .5 + (aRnd - .5) * .25, 0., 1.);
      vec3 col = h < .5 ? mix(cC, cB, h * 2.) : mix(cB, cA, h * 2. - 1.);
      col += vec3(.55, .9, .85) * f * .8 + vec3(.25) * mid;
      vCol = col;
      vA = .55 + .45 * (w * .5 + .5) * uMotion + (1. - uMotion) * .3;
    }`,
  fragmentShader:/* glsl */`
    varying vec3 vCol; varying float vA;
    void main(){
      float d = length(gl_PointCoord - .5);
      float a = smoothstep(.5, .05, d);
      gl_FragColor = vec4(vCol * a, a * vA * .85);
    }`,
});
const swarm = new THREE.Points(geo, mat);
scene.add(swarm);

// jemný prach v pozadí pro hloubku
{
  const M = small ? 500 : 900, dp = new Float32Array(M * 3);
  for (let i = 0; i < M; i++) dp.set([(rnd() - .5) * 22, (rnd() - .5) * 14, -3 - rnd() * 10], i * 3);
  const dg = new THREE.BufferGeometry(); dg.setAttribute('position', new THREE.BufferAttribute(dp, 3));
  scene.add(new THREE.Points(dg, new THREE.PointsMaterial({ color:0x8a93d6, size:1.4, sizeAttenuation:false, transparent:true, opacity:.45, depthWrite:false })));
}

/* ---------- přepínání tvarů ---------- */
let cur = 0, morphStart = -1, auto = !reduce, cycleT = 0;
const CYCLE = 7, MORPH = 2.2;
const chips = [...document.querySelectorAll('.chip')];
const idxEl = document.getElementById('idx'), nameEl = document.getElementById('shapeName'), prog = document.getElementById('prog');
const playBtn = document.getElementById('play');
const smooth = t => t * t * (3 - 2 * t);
function goTo(i){
  if (i === cur && morphStart < 0) return;
  // současné rozložení (bez vlnění) se stane novým startem
  const m = uniforms.uMorph.value;
  for (let k = 0; k < N; k++) {
    const t = smooth(Math.min(1, Math.max(0, m * 1.45 - aRnd[k] * .45)));
    for (let c = 0; c < 3; c++) aFrom[k * 3 + c] += (aTo[k * 3 + c] - aFrom[k * 3 + c]) * t;
  }
  aTo.set(SHAPES[i][1]);
  geo.attributes.aFrom.needsUpdate = true; geo.attributes.aTo.needsUpdate = true;
  uniforms.uMorph.value = 0; morphStart = clock.getElapsedTime(); cur = i; cycleT = 0;
  chips.forEach((b, k) => b.setAttribute('aria-pressed', k === i ? 'true' : 'false'));
  idxEl.textContent = String(i + 1).padStart(2, '0'); nameEl.textContent = SHAPES[i][0];
}
chips.forEach(b => b.addEventListener('click', () => goTo(+b.dataset.i)));
function setAuto(on){
  auto = on; playBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
  playBtn.textContent = on ? '❚❚ Pozastavit střídání' : '▶ Spustit střídání';
}
playBtn.addEventListener('click', () => setAuto(!auto));
setAuto(auto);

/* ---------- ukazatel: myš i prst, převedený do prostoru roje ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0), hitP = new THREE.Vector3();
let mouseTarget = 0, lastMove = 0;
const tilt = { x:0, y:0, tx:0, ty:0 };
function onPointer(e){
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  tilt.tx = ndc.x * .25; tilt.ty = -ndc.y * .18;
  ray.setFromCamera(ndc, camera);
  if (ray.ray.intersectPlane(plane, hitP)) { swarm.worldToLocal(uniforms.uMouse.value.copy(hitP)); mouseTarget = 1; lastMove = performance.now(); }
}
addEventListener('pointermove', onPointer, { passive:true });
addEventListener('pointerdown', onPointer, { passive:true });
addEventListener('pointerleave', () => { mouseTarget = 0; });
document.addEventListener('mouseleave', () => { mouseTarget = 0; });

/* ---------- velikost + smyčka ---------- */
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // na úzkém displeji kamera couvne, aby se tvar vešel na šířku a nechal místo textu
  camera.position.z = w / h < .8 ? 9.4 : 6.2;
  camera.updateProjectionMatrix();
  swarm.position.set(w / h < .8 ? 0 : 1.15, w / h < .8 ? .95 : .15, 0);
}
addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
let rotY = 0, lastT = 0;
function tick(){
  const t = clock.getElapsedTime(), dt = Math.min(.05, t - lastT); lastT = t;
  uniforms.uTime.value = reduce ? t * .25 : t;
  if (morphStart >= 0) {
    const m = Math.min(1, (t - morphStart) / MORPH);
    uniforms.uMorph.value = m;
    if (m >= 1) morphStart = -1;
  }
  if (auto) {
    cycleT += dt;
    prog.style.width = Math.min(100, cycleT / CYCLE * 100) + '%';
    if (cycleT >= CYCLE) goTo((cur + 1) % SHAPES.length);
  } else prog.style.width = '0%';
  if (performance.now() - lastMove > 2200) mouseTarget = 0;
  uniforms.uMouseOn.value += (mouseTarget - uniforms.uMouseOn.value) * .08;
  rotY += (reduce ? .036 : .13) * dt;
  tilt.x += (tilt.tx - tilt.x) * .04; tilt.y += (tilt.ty - tilt.y) * .04;
  swarm.rotation.set(tilt.y, rotY + tilt.x, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
goTo(0);
tick();
</script>

</body>
</html>
